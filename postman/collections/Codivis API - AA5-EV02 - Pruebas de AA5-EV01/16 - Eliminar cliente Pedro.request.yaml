$kind: http-request
method: DELETE
url: "{{baseUrl}}/clientes/{{clientePedroId}}"
order: 16000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("Respuesta JSON y contrato", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        const data = pm.response.json();
        pm.expect(data.codigo).to.be.oneOf(["CLIENTE_ELIMINADO"]);
        pm.expect(data.ok).to.eql(pm.response.code < 300);
        pm.expect(data.mensaje).to.be.a("string").and.not.empty;
        pm.expect(data).not.to.have.property("clave");
        pm.expect(data).not.to.have.property("hash");
      });
