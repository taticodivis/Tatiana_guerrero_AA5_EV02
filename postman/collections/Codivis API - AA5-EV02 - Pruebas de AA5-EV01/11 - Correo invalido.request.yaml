$kind: http-request
method: POST
url: "{{baseUrl}}/clientes"
order: 11000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: "{\n  \"nombre\": \"Luis\",\n  \"correo\": \"correo-invalido\",\n  \"telefono\": \"3007654321\"\n}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400", () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test("Respuesta JSON y contrato", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        const data = pm.response.json();
        pm.expect(data.codigo).to.be.oneOf(["DATOS_INVALIDOS"]);
        pm.expect(data.ok).to.eql(pm.response.code < 300);
        pm.expect(data.mensaje).to.be.a("string").and.not.empty;
        pm.expect(data).not.to.have.property("clave");
        pm.expect(data).not.to.have.property("hash");
      });
